[project]
name = "shorty-api"
version = "0.1.0"
description = "API REST de acortador de URLs con analíticas de clics, rate limiting y Docker."
readme = "README.md"
authors = [
    { name = "David Garcia Garcia", email = "davidgarcia20.academico@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
shorty-api = "shorty_api:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
